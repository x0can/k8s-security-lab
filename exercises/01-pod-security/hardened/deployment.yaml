# HARDENED — passes the Pod Security "restricted" profile and kube-linter.
# Compare field-by-field with ../vulnerable/deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-restricted
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # Host namespaces are NOT shared (defaults are false; shown for clarity).
      hostNetwork: false
      hostPID: false
      hostIPC: false
      automountServiceAccountToken: false   # app doesn't call the API server
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Pinned by digest so the image can't change under you.
          # (nginxinc/nginx-unprivileged listens on 8080 and runs as non-root.)
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          # nginx needs a few writable paths; back them with emptyDir so the
          # root filesystem can stay read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
